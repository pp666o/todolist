services:
  postgres:
    image: pgvector/pgvector:pg17-bookworm
    container_name: todo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_BIND_IP}:${POSTGRES_HOST_PORT}:5432"

    volumes:
      - todo_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  todo_postgres_data:
    name: todo_postgres_data
